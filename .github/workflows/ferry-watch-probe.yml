# Live verification of the Brittany Ferries JSON API sequence.
#
# The provider now talks to the operator's internal "bebop" API directly —
# POST /crossing/prices to find sailings flagged with a pet cabin, then
# POST /crossing/accommodations to confirm real stock. No browser involved.
#
# This workflow exists because the dev sandbox cannot reach the operator, so
# the only way to prove the payloads parse is to run it on a GitHub runner.
name: ferry-watch probe

on:
  workflow_dispatch:
    inputs:
      dateFrom:
        description: "Start of departure window (YYYY-MM-DD)"
        required: false
        default: ""
      dateTo:
        description: "End of departure window (YYYY-MM-DD)"
        required: false
        default: ""
  push:
    branches: [claude/custom-dog-boats-email-awyeg5]
    paths:
      - ".github/workflows/ferry-watch-probe.yml"
      - "projects/ferry-watch/src/**"

jobs:
  probe:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/ferry-watch

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: projects/ferry-watch/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare config
        run: cp ferry-watch.config.example.json ferry-watch.config.json

      # The real thing: the provider's own two-step sequence across all three
      # UK-to-Spain crossings. --dry-run means no email is attempted.
      # FERRY_WATCH_DUMP_DIR makes the provider write the exact request and
      # response for every call. A sweep that finds nothing is otherwise
      # ambiguous — no pet cabins on sale, or a parser looking in the wrong
      # place — and only the raw payload tells those apart. Mirroring the
      # request in a separate curl drifts out of step with the code, which is
      # exactly what happened: the curl 400'd on a date format the provider
      # never sends.
      # The configured window is four weeks out and every pet cabin on it is
      # sold out, so the accommodations call never fires there. Dispatching
      # with a window far enough ahead to still have stock is the only way to
      # exercise the second half of the sequence.
      - name: Run a live check
        env:
          FERRY_WATCH_DUMP_DIR: ./calibration
          DATE_FROM: ${{ github.event.inputs.dateFrom }}
          DATE_TO: ${{ github.event.inputs.dateTo }}
        run: |
          # Without pipefail the pipe hides a total failure behind head's exit 0,
          # so a sweep where every route errored would report green.
          set -o pipefail
          ARGS=""
          [ -n "$DATE_FROM" ] && ARGS="$ARGS --from $DATE_FROM"
          [ -n "$DATE_TO" ] && ARGS="$ARGS --to $DATE_TO"
          pnpm exec tsx src/cli.ts check --dry-run $ARGS 2>&1 | head -200

      # Raw JSON truncated at a byte count answers nothing — the interesting
      # part is never in the first 2 KB. These questions are: does the parser
      # see the sailings, and is petCabinAvailable ever true? A sweep finding
      # nothing is only trustworthy once the second answer is known.
      - name: Summarise captured payloads
        if: always()
        run: |
          for f in calibration/*.json; do
            [ -e "$f" ] || continue
            echo "=== $f ($(wc -c < "$f") bytes) ==="
            jq -r '
              "request ports: \(.request.departurePort) -> \(.request.arrivalPort)",
              "request dates: \(.request.fromDate) .. \(.request.toDate)",
              "response top-level keys: \(.response | if type=="object" then keys else type end)",
              ( [ .response | .. | objects | select(has("petAvailabilities")) ] as $s
                | "sailings with petAvailabilities: \($s | length)",
                  "petCabinAvailable true: \([ $s[] | select(.petAvailabilities.petCabinAvailable == true) ] | length)",
                  "petCabinAvailable false: \([ $s[] | select(.petAvailabilities.petCabinAvailable == false) ] | length)",
                  "sailing field names: \($s[0] // {} | keys)",
                  "petAvailabilities keys: \($s[0].petAvailabilities // {} | keys)"
              )
            ' "$f" || echo "jq failed on $f"
            echo
          done

          # One whole sailing object, so the field names the provider guesses
          # at (shipName, departureDate, ticketTier) can be checked against
          # what is actually there rather than assumed.
          first=$(ls calibration/*prices*.json 2>/dev/null | head -1)
          if [ -n "$first" ]; then
            echo "=== one full sailing from $first ==="
            jq -r '[ .response | .. | objects | select(has("petAvailabilities")) ][0]' "$first"
          fi

      - name: Upload captured payloads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ferry-watch-api-payloads
          path: projects/ferry-watch/calibration/
          if-no-files-found: warn
          retention-days: 14
